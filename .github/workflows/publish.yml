name: Publish to npm

# Requires this package to be registered on npm at least once already (see the
# "Publishing" section in README.md for the one-time bootstrap steps and how
# to configure npm Trusted Publishing for this repo/workflow).

on:
  push:
    tags:
      # GitHub Actions tag filters are glob patterns, not regex - this is intentionally
      # permissive (e.g. also matches v1.2.3-beta.1). The "Verify tag matches
      # package.json version" step below does the real, exact validation.
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Uses npm's OIDC "Trusted Publishing" (https://docs.npmjs.com/trusted-publishers/)
    # instead of a long-lived NPM_TOKEN secret. id-token: write is the only elevated
    # permission this job needs.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # npm trusted publishing needs npm CLI >= 11.5.1
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run compile

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish
